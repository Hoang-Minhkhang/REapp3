name: Build REapp3

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore REapp3.sln

      - name: Build
        run: msbuild REapp3.sln /p:Configuration=Release

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: REapp3
          path: '**/bin/Release/*'